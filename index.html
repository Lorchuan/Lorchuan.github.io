<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>朋友圈</title>
    <style>
        /* 基础页面设置 */
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; 
            background-color: #ffffff; 
            -webkit-tap-highlight-color: transparent;
        }
        .moment { 
            display: flex; 
            max-width: 600px; 
            margin: 0 auto; 
        }
        
        /* 头像 */
        .avatar { 
            width: 42px; 
            height: 42px; 
            border-radius: 4px; 
            background-color: #eee; 
            margin-right: 12px; 
            object-fit: cover; 
            flex-shrink: 0;
        }
        
        /* 右侧内容区 */
        .content { 
            flex: 1; 
        }
        .name { 
            color: #576b95; 
            font-size: 17px; 
            font-weight: 600; 
            margin-bottom: 6px; 
        }
        .text { 
            font-size: 16px; 
            color: #111; 
            margin-bottom: 12px; 
            line-height: 1.5; 
            word-wrap: break-word; 
            white-space: pre-wrap; /* 保留文字换行 */
        }
        
        /* 四张图片的四宫格布局 */
        .images { 
            display: grid; 
            grid-template-columns: repeat(2, 90px); 
            gap: 5px; 
            margin-bottom: 12px; 
        }
        .images img { 
            width: 90px; 
            height: 90px; 
            object-fit: cover; 
            background-color: #eee; 
        }
        
        /* 时间 */
        .time { 
            font-size: 13px; 
            color: #b2b2b2; 
            margin-bottom: 12px; 
        }
        
        /* 点赞区 */
        .interaction { 
            background-color: #f3f3f5; 
            padding: 8px 10px; 
            border-radius: 4px; 
            font-size: 14px; 
            color: #576b95; 
            position: relative; 
        }
        /* 点赞区上方的小三角 */
        .interaction::before { 
            content: ""; 
            position: absolute; 
            top: -10px; 
            left: 12px; 
            border-width: 5px; 
            border-style: solid; 
            border-color: transparent transparent #f3f3f5 transparent; 
        }
        .likes { 
            display: flex; 
            align-items: flex-start; 
            line-height: 1.6; 
            font-weight: 600;
        }
        .heart { 
            margin-right: 6px; 
            font-size: 12px; 
            line-height: 1.8;
            color: #576b95;
        }
    </style>
</head>
<body>
    <div class="moment">
        <img class="avatar" src="avatar.jpg" alt="头像">
        
        <div class="content">
            <div class="name">他的微信昵称</div>
            
            <div class="text">这里填入他朋友圈的一段文字。
这段代码支持自动换行，你直接在这里按回车换行即可在网页上生效。</div>
            
            <div class="images">
                <img src="img1.jpg" alt="图1">
                <img src="img2.jpg" alt="图2">
                <img src="img3.jpg" alt="图3">
                <img src="img4.jpg" alt="图4">
            </div>
            
            <div class="time">2小时前</div>
            
            <div class="interaction">
                <div class="likes">
                    <span class="heart">♡</span>
                    张三, 李四, 王五, 你的名字, 赵六
                </div>
            </div>
        </div>
    </div>
</body>
</html>
